<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Interactive Canvas - Procreate Edition</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Barra Superior Estilo Procreate (Top Navbar) -->
  <nav class="pro-navbar">
    <!-- Lado Izquierdo: Galería y Herramientas Globales -->
    <div class="pro-nav-group">
      <span class="pro-title">Lienzo Infinito</span>
      <button id="btn-actions" class="pro-icon-btn" title="Acciones y Ajustes">🔧</button>
      <button id="tool-lasso" class="pro-icon-btn" title="Selección Lazo">✂️</button>
      <button id="tool-pan" class="pro-icon-btn" title="Mover Lienzo">✋</button>
    </div>

    <!-- Lado Derecho: Pinceles, Borrador, Capas y Color -->
    <div class="pro-nav-group">
      <button id="tool-brush" class="pro-icon-btn active" title="Librería de Pinceles">🖌️</button>
      <button id="tool-highlighter" class="pro-icon-btn" title="Resaltador">🖍️</button>
      <button id="tool-math" class="pro-icon-btn" title="Función Matemática f(x)">🧮</button>
      <button id="btn-layers" class="pro-icon-btn" title="Capas">📑</button>
      
      <!-- Indicador / Selector de Color estilo Procreate -->
      <div id="color-circle" class="pro-color-circle" style="background-color: #ffffff;">
        <input type="color" id="color-picker" class="pro-color-input" value="#ffffff">
      </div>
    </div>
  </nav>

  <!-- Barra Lateral Izquierda Estilo Procreate (Sliders de Tamaño y Opacidad) -->
  <aside class="pro-sidebar-left">
    <div class="pro-slider-group">
      <label>Tamaño</label>
      <input type="range" id="slider-size" class="pro-slider-vertical" min="1" max="100" value="4">
    </div>
    <div class="pro-slider-group">
      <label>Opacidad</label>
      <input type="range" id="slider-opacity" class="pro-slider-vertical" min="10" max="100" value="100">
    </div>
  </aside>

  <!-- Popover Panel: Menú de Acciones y Ajustes -->
  <div id="panel-actions" class="pro-popover">
    <div class="pro-popover-header">
      <span>Acciones y Ajustes</span>
    </div>
    <div class="pro-popover-list">
      <button id="btn-qr" class="pro-popover-item">📱 Emparejar Dispositivo (QR)</button>
      <button id="btn-reset-view" class="pro-popover-item">🎯 Resetear Cámara (0,0)</button>
      <button id="btn-clear" class="pro-popover-item" style="color: #f87171;">🗑️ Limpiar Lienzo</button>
    </div>
  </div>

  <!-- Modal Popover para Código QR -->
  <div id="modal-qr" class="pro-popover" style="top: 70px; right: 20px; width: 240px; text-align: center;">
    <div class="pro-popover-header">
      <span>Emparejar Dispositivo</span>
    </div>
    <div id="qr-container" style="display: flex; justify-content: center; margin: 10px 0;"></div>
    <p id="qr-url-text" style="font-size: 10px; color: #71717a; word-break: break-all; font-family: monospace;"></p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import { CanvasEngine } from './js/CanvasEngine.js';
    import { InputManager } from './js/InputManager.js';
    import { StorageManager } from './js/storage.js';
    import { SyncManager } from './js/SyncManager.js';
    import { QRManager } from './js/QRManager.js';
    import { LassoTool } from './js/LassoTool.js';
    import { MathSuite } from './js/MathSuite.js';

    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    if (!roomId || !/^[a-zA-Z0-9_-]{16,32}$/.test(roomId)) {
      roomId = 'room_' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
      window.history.replaceState({}, '', `?room=${roomId}`);
    }

    const container = document.getElementById('canvas-container');
    const engine = new CanvasEngine(container);
    const storage = new StorageManager(roomId);

    const socket = io({
      reconnection: true,
      reconnectionDelay: 500,
      reconnectionDelayMax: 10000,
      randomizationFactor: 0.5
    });

    socket.emit('join-room', roomId);

    const sync = new SyncManager(socket, storage, (updatedScene) => {
      if (updatedScene) engine.setElements(updatedScene);
    });

    storage.getScene().then((scene) => {
      engine.setElements(scene);
      socket.emit('sync-request');
    });

    const input = new InputManager(container, {
      onStrokeStart: (stroke) => {
        engine.setActiveStroke({
          id: 'str_' + sync.clientId + '_' + Date.now(),
          type: 'stroke',
          color: stroke.color,
          width: stroke.width,
          isHighlighter: stroke.tool === 'highlighter',
          points: stroke.points
        });
      },
      onStrokeMove: (stroke) => {
        if (engine.activeStroke) {
          engine.activeStroke.points = stroke.points;
          engine.renderDynamicLayer();
        }
      },
      onStrokeEnd: (stroke) => {
        if (engine.activeStroke) {
          const completedStroke = {
            ...engine.activeStroke,
            points: stroke.points
          };
          engine.addElement(completedStroke);
          engine.setActiveStroke(null);
          sync.emitElement(completedStroke);
        }
      },
      onPanZoom: (panX, panY, scale) => {
        engine.setCamera(panX, panY, scale);
      }
    });

    // Procreate Sliders (Tamaño y Opacidad)
    const sliderSize = document.getElementById('slider-size');
    const colorPicker = document.getElementById('color-picker');
    const colorCircle = document.getElementById('color-circle');

    sliderSize.oninput = (e) => {
      input.setTool(input.currentTool, input.currentColor, parseFloat(e.target.value));
    };

    colorPicker.oninput = (e) => {
      const color = e.target.value;
      colorCircle.style.backgroundColor = color;
      input.setTool(input.currentTool, color, input.currentWidth);
    };

    // UI Listeners (Barra Estilo Procreate)
    const tools = [
      { id: 'tool-brush', name: 'pen' },
      { id: 'tool-highlighter', name: 'highlighter' },
      { id: 'tool-lasso', name: 'lasso' },
      { id: 'tool-pan', name: 'pan' }
    ];

    tools.forEach(t => {
      document.getElementById(t.id).onclick = (e) => {
        input.setTool(t.name);
        setActiveToolBtn(e.currentTarget);
      };
    });

    document.getElementById('tool-math').onclick = () => {
      const fnStr = prompt('Ingresa una función matemática f(x):', 'Math.sin(x)');
      if (fnStr) {
        const points = MathSuite.generateFunctionPlot(fnStr, -10, 10, 0.1);
        const mathStroke = {
          id: 'math_' + sync.clientId + '_' + Date.now(),
          type: 'stroke',
          color: input.currentColor,
          width: 3 / engine.scale,
          isHighlighter: false,
          points: points
        };
        engine.addElement(mathStroke);
        sync.emitElement(mathStroke);
      }
    };

    // Panel de Acciones y QR
    const btnActions = document.getElementById('btn-actions');
    const panelActions = document.getElementById('panel-actions');
    const btnQr = document.getElementById('btn-qr');
    const modalQr = document.getElementById('modal-qr');
    const qrContainer = document.getElementById('qr-container');
    const qrUrlText = document.getElementById('qr-url-text');

    btnActions.onclick = () => {
      panelActions.classList.toggle('active');
      modalQr.classList.remove('active');
    };

    btnQr.onclick = () => {
      panelActions.classList.remove('active');
      modalQr.classList.toggle('active');
      const currentUrl = window.location.href;
      qrUrlText.innerText = currentUrl;
      QRManager.renderQR(currentUrl, qrContainer);
    };

    document.getElementById('btn-reset-view').onclick = () => {
      input.setCamera(0, 0, 1.0);
      engine.setCamera(0, 0, 1.0);
      panelActions.classList.remove('active');
    };

    document.getElementById('btn-clear').onclick = async () => {
      await storage.clearScene();
      engine.setElements([]);
      socket.emit('draw-action', { element: { id: 'clear_all', type: 'clear' } });
      panelActions.classList.remove('active');
    };

    function setActiveToolBtn(btn) {
      document.querySelectorAll('.pro-icon-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
