<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Canvas - Pizarra Infinito-Bidireccional Real-Time</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #121214;
      color: #f4f4f5;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    /* Toolbar Glassmorphism UI */
    .toolbar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(24, 24, 27, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }
    .btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover, .btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }
    .color-picker {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      align-self: center;
    }
    /* Modal QR */
    #qr-modal {
      display: none;
      position: absolute;
      top: 80px;
      right: 20px;
      z-index: 101;
      padding: 16px;
      background: rgba(24, 24, 27, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Barra de Herramientas Flotante Bento/Glassmorphism -->
  <div class="toolbar">
    <button id="tool-pen" class="btn active">✏️ Pluma</button>
    <button id="tool-highlighter" class="btn">🖍️ Resaltador</button>
    <button id="tool-lasso" class="btn">✂️ Lazo</button>
    <button id="tool-math" class="btn">🧮 Función f(x)</button>
    <input type="color" id="color-picker" class="color-picker" value="#ffffff">
    <button id="btn-qr" class="btn">📱 QR</button>
    <button id="btn-clear" class="btn" style="color: #ef4444;">🗑️ Limpiar</button>
  </div>

  <!-- Modal de Código QR -->
  <div id="qr-modal">
    <p style="margin-bottom: 8px; font-size: 12px; color: #a1a1aa;">Escanea para conectar dispositivo</p>
    <div id="qr-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import { CanvasEngine } from './js/CanvasEngine.js';
    import { InputManager } from './js/InputManager.js';
    import { StorageManager } from './js/storage.js';
    import { SyncManager } from './js/SyncManager.js';
    import { QRManager } from './js/QRManager.js';
    import { LassoTool } from './js/LassoTool.js';
    import { MathSuite } from './js/MathSuite.js';

    // Generación o extracción de Room ID
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    if (!roomId || !/^[a-zA-Z0-9_-]{16,32}$/.test(roomId)) {
      roomId = 'room_' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
      window.history.replaceState({}, '', `?room=${roomId}`);
    }

    const container = document.getElementById('canvas-container');
    const engine = new CanvasEngine(container);
    const storage = new StorageManager(roomId);

    // Socket.io con Backoff Exponencial con Jitter (E-SWE Hardening)
    const socket = io({
      reconnection: true,
      reconnectionDelay: 500,
      reconnectionDelayMax: 10000,
      randomizationFactor: 0.5
    });

    socket.emit('join-room', roomId);

    const sync = new SyncManager(socket, storage, (updatedScene) => {
      if (updatedScene) engine.setElements(updatedScene);
    });

    // Cargar estado inicial local
    storage.getScene().then((scene) => {
      engine.setElements(scene);
      socket.emit('sync-request');
    });

    // Inicializar InputManager
    const input = new InputManager(container, {
      onStrokeStart: (stroke) => {
        engine.setActiveStroke({
          id: 'str_' + sync.clientId + '_' + Date.now(),
          type: 'stroke',
          color: stroke.color,
          width: stroke.width,
          isHighlighter: stroke.tool === 'highlighter',
          points: stroke.points
        });
      },
      onStrokeMove: (stroke) => {
        if (engine.activeStroke) {
          engine.activeStroke.points = stroke.points;
          engine.renderDynamicLayer();
        }
      },
      onStrokeEnd: (stroke) => {
        if (engine.activeStroke) {
          engine.activeStroke.points = stroke.points;
          sync.emitElement(engine.activeStroke);
          engine.setActiveStroke(null);
        }
      },
      onPanZoom: (panX, panY, scale) => {
        engine.setCamera(panX, panY, scale);
      }
    });

    // UI Listeners
    document.getElementById('tool-pen').onclick = (e) => {
      input.setTool('pen');
      setActiveBtn(e.target);
    };
    document.getElementById('tool-highlighter').onclick = (e) => {
      input.setTool('highlighter');
      setActiveBtn(e.target);
    };
    document.getElementById('tool-lasso').onclick = (e) => {
      input.setTool('lasso');
      setActiveBtn(e.target);
    };
    document.getElementById('tool-math').onclick = (e) => {
      const fnStr = prompt('Ingresa una función matemática f(x):', 'Math.sin(x)');
      if (fnStr) {
        const points = MathSuite.generateFunctionPlot(fnStr, -10, 10, 0.1);
        const mathStroke = {
          id: 'math_' + sync.clientId + '_' + Date.now(),
          type: 'stroke',
          color: '#38bdf8',
          width: 3 / engine.scale,
          isHighlighter: false,
          points: points
        };
        sync.emitElement(mathStroke);
      }
    };
    document.getElementById('color-picker').onchange = (e) => {
      input.setTool(input.currentTool, e.target.value);
    };
    document.getElementById('btn-clear').onclick = async () => {
      await storage.clearScene();
      engine.setElements([]);
      socket.emit('draw-action', { element: { id: 'clear_all', type: 'clear' } });
    };

    // Modal QR
    const qrBtn = document.getElementById('btn-qr');
    const qrModal = document.getElementById('qr-modal');
    const qrContainer = document.getElementById('qr-container');
    qrContainer.innerHTML = QRManager.generateQRSVG(window.location.href);

    qrBtn.onclick = () => {
      qrModal.style.display = qrModal.style.display === 'block' ? 'none' : 'block';
    };

    function setActiveBtn(btn) {
      document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
